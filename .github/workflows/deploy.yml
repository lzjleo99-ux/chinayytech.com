name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Asset URLs are already versioned in the committed HTML by tools/stamp.py.
      # Stamping here instead would only apply when this workflow is the pipeline
      # that publishes, and the repository also has GitHub's default branch
      # deploy enabled, so the two race and the unstamped build can win.
      - name: Verify assets are versioned
        run: |
          if grep -rl "__BUILD__" index.html contact.html privacy.html js/main.js; then
            echo "::error::Unstamped asset URLs. Run: python3 tools/stamp.py"
            exit 1
          fi
          echo "Asset version: $(grep -ohE '\?v=[0-9a-f]+' index.html | head -1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
