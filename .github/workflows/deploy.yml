name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Pages serves assets with max-age=600 at URLs that never change, so a
      # browser keeps replaying a stale bundle after a deploy. Stamping the
      # commit SHA into the asset URLs forces a fresh fetch every release.
      - name: Stamp build id into asset URLs
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i "s/__BUILD__/${BUILD}/g" index.html contact.html privacy.html js/main.js
          echo "Stamped build ${BUILD}"
          grep -o "v=${BUILD}" index.html contact.html privacy.html js/main.js | sort | uniq -c

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
